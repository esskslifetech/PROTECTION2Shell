name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The toolkit's own colours are disabled so logs stay readable.
  NO_COLOR: "1"

jobs:
  self-tests:
    name: self-tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      # Which bash actually runs matters: macOS ships 3.2 and that is the
      # compatibility floor, but a Homebrew bash earlier in PATH would hide
      # 3.2-only breakage. Print it so a failure is interpretable.
      - name: Report the shell in use
        shell: bash
        run: |
          printf 'shell     : %s\n' "$BASH_VERSION"
          printf 'resolved  : %s\n' "$(command -v bash)"
          bash --version | head -1

      - name: Syntax check every script
        shell: bash
        run: |
          set -u
          rc=0
          for f in $(find . -type f -name '*.sh' -not -path './.git/*'); do
            if bash -n "$f"; then printf 'ok  %s\n' "$f"; else printf 'BAD %s\n' "$f"; rc=1; fi
          done
          exit "$rc"

      - name: Run the self-test suite
        shell: bash
        run: |
          # The assertions ARE the diagnosis, and on a public repo anonymous
          # readers cannot open the log — a red X alone sends somebody to an
          # issue with nothing to attach. Capture the run, print it, mirror each
          # failure into an annotation, keep the whole file as an artifact.
          set +e
          ./tests/run-tests.sh > tests.log 2>&1
          rc=$?
          cat tests.log
          echo "self-tests exit code: $rc"
          [ "$rc" = 0 ] && exit 0

          n=0; abort=0
          n=$(grep -c '^\[FAIL\] FAIL:' tests.log)
          while IFS= read -r line; do
            # % must be escaped or GitHub mis-parses the command itself
            printf '::error::%s\n' "$(printf '%s' "$line" | sed 's/%/%AZ/g')"
          done < <(grep '^\[FAIL\] FAIL:' tests.log | head -30)

          # No FAIL line but a non-zero exit means the interpreter died rather
          # than an assertion disagreeing: an unbound variable, an option this
          # bash does not know (macOS is 3.2), a command that is not on a BSD
          # system. That is a portability defect and needs its own annotation.
          if [ "$n" = 0 ]; then
            abort=1
            echo "--- no assertion failed: the run aborted ---"
            grep -E 'unbound variable|invalid option|Bad substitution|syntax error|command not found|No such file' tests.log | head -10 | while IFS= read -r line; do
              printf '::error::abort: %s\n' "$(printf '%s' "$line" | sed 's/%/%AZ/g')"
            done
            tail -n 15 tests.log
          fi

          # Where it stopped and the tally, so one annotation is enough context.
          echo "--- last steps ---"
          grep '^==> ' tests.log | tail -3
          grep '^passed:' tests.log
          if [ "$abort" = 1 ]; then
            printf '::error::self-tests aborted before any assertion reported on %s (%s)\n' "${{ matrix.os }}" "$(bash --version | head -1)"
          fi
          exit "$rc"

      - name: Upload the self-test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-log-${{ matrix.os }}
          path: tests.log
          if-no-files-found: ignore

      - name: Audit-mode smoke test (dry-run, no changes)
        shell: bash
        run: |
          # A host with nothing to find must still exit 0 (clean) or 2 (findings).
          # Capture the output: when this fails the log is the only explanation,
          # and public repos hide logs from anonymous readers — so surface the
          # tail as an annotation, and re-run under `bash -x` for the trace.
          out="$(mktemp "${TMPDIR:-/tmp}/psp-smoke.XXXXXX")"
          trace="$(mktemp "${TMPDIR:-/tmp}/psp-trace.XXXXXX")"
          rc=0
          ./setup.sh --dry-run --no-upgrade >"$out" 2>&1 || rc=$?
          case "$rc" in
            0|2)
              echo "dry-run completed with rc=$rc"
              tail -n 20 "$out"
              ;;
            *)
              echo "unexpected exit code $rc"
              cat "$out"
              bash -x ./setup.sh --dry-run --no-upgrade >/dev/null 2>"$trace" || true
              echo "--- trace tail ---"
              tail -n 15 "$trace"
              echo "::error::setup.sh exited $rc on $(command -v bash) ($BASH_VERSION)"
              tail -n 10 "$trace" | while IFS= read -r line; do
                printf '::error::%s\n' "$line"
              done
              exit 1
              ;;
          esac

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck

      # Two tiers, deliberately different:
      #   error severity  -> blocks. A parse error or a broken expansion is
      #                      always a real defect and must never ship.
      #   warning severity-> reported, does not block. The tree is not
      #                      warning-clean yet (mostly SC2046 on `for x in
      #                      $(find ...)`). Findings stay visible here and in
      #                      the job summary so they can be burned down without
      #                      a red X that nobody reads.
      - name: Lint (errors block, warnings are reported)
        shell: bash
        run: |
          set -u
          targets="setup.sh rollback.sh install.sh lib/common.sh lib/detect.sh
                   lib/cve_db.sh lib/fix.sh lib/report.sh hunt/hunt.sh
                   tests/run-tests.sh patches/apply-source-patches.sh"
          # shellcheck disable=SC2086
          if shellcheck -S error -x $targets; then
            echo "error-severity: clean"
          else
            echo "::error::shellcheck reported error-severity findings"
            exit 1
          fi
          # shellcheck disable=SC2086
          shellcheck -S warning -x -f gcc $targets > sc.txt 2>&1 || true
          n="$(grep -cE '(warning|error):' sc.txt || true)"
          echo "warning-severity findings: $n"
          cat sc.txt
          {
            echo "### shellcheck — warning severity"
            echo
            echo "Findings: **$n** (advisory; error severity is enforced above)"
            echo
            echo '```'
            cat sc.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          head -10 sc.txt | while IFS= read -r line; do
            printf '::warning::%s\n' "$line"
          done

  php-lint:
    name: php lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install php-cli
        run: sudo apt-get update -qq && sudo apt-get install -y php-cli

      - name: Lint the project scanner
        run: php -l scanner/project-scanner.php
